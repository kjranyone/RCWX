[package]
name = "rcwx-nn"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
pollster = "1.0.1"
rustfft = "6.4.1"
safetensors = "0.8.0"
serde_json = "1.0.154"
wgpu = "30.0.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Graphics_Direct3D12"] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
