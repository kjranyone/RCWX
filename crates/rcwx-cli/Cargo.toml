[package]
name = "rcwx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rcwx-nn = { path = "../rcwx-nn" }
hound = "3.5"
anyhow = "1"
bytemuck = "1.25.2"
rcwx-dsp = { version = "0.1.0", path = "../rcwx-dsp" }
cpal = "0.18.2"
ureq = "3.5.1"
serde_json = "1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
rcwx-rt = { version = "0.1.0", path = "../rcwx-rt" }

[[bin]]
name = "rcwx-cli"
path = "src/main.rs"
